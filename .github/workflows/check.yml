name: Integration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts-and-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm run lint --workspace n8n-nodes-polymorfa
      - run: npm run validate:zapier
      - run: npm run check:sdk
      - run: node scripts/check-upstream.mjs --pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: node --test --test-reporter=spec tests/*.test.cjs tests/*.test.mjs
